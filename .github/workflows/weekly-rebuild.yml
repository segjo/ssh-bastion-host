name: Weekly Security Rebuild

on:
  schedule:
    # Run every Monday at 2:00 UTC to rebuild with latest base image packages
    - cron: "0 2 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=SSH Bastion Host
            org.opencontainers.image.description=Reverse SSH bastion host with key-based authentication
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Don't use cache to ensure we get latest base image updates
          no-cache: true
