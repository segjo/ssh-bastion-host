<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
    <!-- Background with mesh gradient -->
    <defs>
        <linearGradient id="meshGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#030712;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#0c1220;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#030712;stop-opacity:1" />
        </linearGradient>
        <radialGradient id="meshGlow1" cx="20%" cy="20%">
            <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.15" />
            <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
        </radialGradient>
        <radialGradient id="meshGlow2" cx="80%" cy="80%">
            <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
        </radialGradient>
        <filter id="blur">
            <feGaussianBlur in="SourceGraphic" stdDeviation="120" />
        </filter>
        <filter id="glass">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
        </filter>
    </defs>

    <!-- Main background -->
    <rect width="1400" height="900" fill="url(#meshGradient1)" />
    <rect width="1400" height="900" fill="url(#meshGlow1)" />
    <rect width="1400" height="900" fill="url(#meshGlow2)" />

    <!-- Header -->
    <g id="header">
        <!-- Glass effect background -->
        <rect x="40" y="40" width="1320" height="100" rx="16" fill="#1e293b" opacity="0.3"
            filter="url(#glass)" />
        <rect x="40" y="40" width="1320" height="100" rx="16" fill="none" stroke="#334155"
            stroke-width="1" />

        <!-- Logo and title -->
        <circle cx="80" cy="90" r="20" fill="#06b6d4" />
        <text x="120" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="28"
            font-weight="700" fill="#f1f5f9">SSH Bastion</text>
        <text x="120" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16"
            font-weight="400" fill="#94a3b8">Connection Monitor</text>

        <!-- Stats boxes -->
        <g id="stats">
            <!-- Active Connections -->
            <rect x="900" y="60" width="180" height="60" rx="12" fill="#0e7490" opacity="0.2" />
            <rect x="900" y="60" width="180" height="60" rx="12" fill="none" stroke="#06b6d4"
                stroke-width="1" />
            <text x="920" y="85" font-family="system-ui" font-size="13" fill="#94a3b8">Active</text>
            <text x="920" y="110" font-family="system-ui" font-size="24" font-weight="700"
                fill="#22d3ee">3</text>

            <!-- Status -->
            <rect x="1100" y="60" width="240" height="60" rx="12" fill="#065f46" opacity="0.2" />
            <rect x="1100" y="60" width="240" height="60" rx="12" fill="none" stroke="#10b981"
                stroke-width="1" />
            <circle cx="1120" cy="90" r="6" fill="#10b981" />
            <text x="1135" y="95" font-family="system-ui" font-size="14" fill="#d1fae5">Online</text>
            <text x="1220" y="95" font-family="system-ui" font-size="12" fill="#6ee7b7">16:45:30</text>
        </g>
    </g>

    <!-- Connection Card 1 -->
    <g id="connection1">
        <rect x="40" y="180" width="1320" height="180" rx="16" fill="#1e293b" opacity="0.3"
            filter="url(#glass)" />
        <rect x="40" y="180" width="1320" height="180" rx="16" fill="none" stroke="#334155"
            stroke-width="1" />

        <!-- Status indicator -->
        <circle cx="70" cy="210" r="8" fill="#10b981" />
        <text x="90" y="215" font-family="system-ui" font-size="14" font-weight="600" fill="#10b981">
            Connected</text>
        <text x="1280" y="215" font-family="monospace" font-size="12" fill="#64748b">PID: 12847</text>

        <!-- Connection details grid -->
        <text x="70" y="250" font-family="system-ui" font-size="13" fill="#64748b">User</text>
        <text x="70" y="275" font-family="monospace" font-size="16" fill="#e2e8f0">root</text>

        <text x="250" y="250" font-family="system-ui" font-size="13" fill="#64748b">Bastion Host</text>
        <text x="250" y="275" font-family="monospace" font-size="16" fill="#e2e8f0">
            bastion.example.com:2222</text>

        <text x="600" y="250" font-family="system-ui" font-size="13" fill="#64748b">Reverse Port</text>
        <rect x="600" y="260" width="80" height="28" rx="6" fill="#06b6d4" opacity="0.2" />
        <text x="620" y="280" font-family="monospace" font-size="16" font-weight="600"
            fill="#22d3ee">8080</text>

        <text x="750" y="250" font-family="system-ui" font-size="13" fill="#64748b">Local Bind</text>
        <text x="750" y="275" font-family="monospace" font-size="16" fill="#e2e8f0">localhost:22</text>

        <text x="70" y="315" font-family="system-ui" font-size="13" fill="#64748b">Command</text>
        <text x="70" y="340" font-family="monospace" font-size="12" fill="#94a3b8">autossh -M 0 -N
            -R *:8080:localhost:22 bastion@bastion.example.com -p 2222</text>
    </g>

    <!-- Connection Card 2 -->
    <g id="connection2">
        <rect x="40" y="380" width="1320" height="180" rx="16" fill="#1e293b" opacity="0.3"
            filter="url(#glass)" />
        <rect x="40" y="380" width="1320" height="180" rx="16" fill="none" stroke="#334155"
            stroke-width="1" />

        <!-- Status indicator -->
        <circle cx="70" cy="410" r="8" fill="#10b981" />
        <text x="90" y="415" font-family="system-ui" font-size="14" font-weight="600" fill="#10b981">
            Connected</text>
        <text x="1280" y="415" font-family="monospace" font-size="12" fill="#64748b">PID: 13024</text>

        <!-- Connection details grid -->
        <text x="70" y="450" font-family="system-ui" font-size="13" fill="#64748b">User</text>
        <text x="70" y="475" font-family="monospace" font-size="16" fill="#e2e8f0">webserver</text>

        <text x="250" y="450" font-family="system-ui" font-size="13" fill="#64748b">Bastion Host</text>
        <text x="250" y="475" font-family="monospace" font-size="16" fill="#e2e8f0">
            bastion.example.com:2222</text>

        <text x="600" y="450" font-family="system-ui" font-size="13" fill="#64748b">Reverse Port</text>
        <rect x="600" y="460" width="80" height="28" rx="6" fill="#06b6d4" opacity="0.2" />
        <text x="620" y="480" font-family="monospace" font-size="16" font-weight="600"
            fill="#22d3ee">3000</text>

        <text x="750" y="450" font-family="system-ui" font-size="13" fill="#64748b">Local Bind</text>
        <text x="750" y="475" font-family="monospace" font-size="16" fill="#e2e8f0">localhost:80</text>

        <text x="70" y="515" font-family="system-ui" font-size="13" fill="#64748b">Command</text>
        <text x="70" y="540" font-family="monospace" font-size="12" fill="#94a3b8">ssh -N -R
            *:3000:localhost:80 bastion@bastion.example.com -p 2222</text>
    </g>

    <!-- Connection Card 3 -->
    <g id="connection3">
        <rect x="40" y="580" width="1320" height="180" rx="16" fill="#1e293b" opacity="0.3"
            filter="url(#glass)" />
        <rect x="40" y="580" width="1320" height="180" rx="16" fill="none" stroke="#334155"
            stroke-width="1" />

        <!-- Status indicator -->
        <circle cx="70" cy="610" r="8" fill="#10b981" />
        <text x="90" y="615" font-family="system-ui" font-size="14" font-weight="600" fill="#10b981">
            Connected</text>
        <text x="1280" y="615" font-family="monospace" font-size="12" fill="#64748b">PID: 13156</text>

        <!-- Connection details grid -->
        <text x="70" y="650" font-family="system-ui" font-size="13" fill="#64748b">User</text>
        <text x="70" y="675" font-family="monospace" font-size="16" fill="#e2e8f0">database</text>

        <text x="250" y="650" font-family="system-ui" font-size="13" fill="#64748b">Bastion Host</text>
        <text x="250" y="675" font-family="monospace" font-size="16" fill="#e2e8f0">
            bastion.example.com:2222</text>

        <text x="600" y="650" font-family="system-ui" font-size="13" fill="#64748b">Reverse Port</text>
        <rect x="600" y="660" width="80" height="28" rx="6" fill="#06b6d4" opacity="0.2" />
        <text x="615" y="680" font-family="monospace" font-size="16" font-weight="600"
            fill="#22d3ee">5432</text>

        <text x="750" y="650" font-family="system-ui" font-size="13" fill="#64748b">Local Bind</text>
        <text x="750" y="675" font-family="monospace" font-size="16" fill="#e2e8f0">localhost:5432</text>

        <text x="70" y="715" font-family="system-ui" font-size="13" fill="#64748b">Command</text>
        <text x="70" y="740" font-family="monospace" font-size="12" fill="#94a3b8">autossh -M 0 -N
            -R *:5432:localhost:5432 bastion@bastion.example.com -p 2222</text>
    </g>

    <!-- Footer info -->
    <text x="40" y="880" font-family="system-ui" font-size="12" fill="#475569">Auto-refresh: 5s</text>
    <text x="1240" y="880" font-family="system-ui" font-size="12" fill="#475569">Press R to refresh</text>
</svg>