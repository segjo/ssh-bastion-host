[package]
name = "ssh-bastion-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "=4.4.0"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
anyhow = "1.0"
time = { version = "0.3.36", features = [] }

[profile.release]
opt-level = 3
