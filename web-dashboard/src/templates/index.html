<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#030712" />
    <meta
      name="description"
      content="Real-time SSH reverse tunnel connection monitor"
    />
    <title>SSH Bastion Dashboard</title>
    <link rel="stylesheet" href="/web-dashboard/src/templates//style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-content">
          <h1>
            <span class="logo">🔐</span>
            <span class="title-text">SSH Bastion</span>
          </h1>
          <div class="header-info">
            <div class="info-item">
              <span class="label">Active Tunnels</span>
              <span class="value" id="connection-count">0</span>
            </div>
            <div class="info-item">
              <span class="label">Last Sync</span>
              <span class="value" id="last-update">--:--:--</span>
            </div>
            <div class="info-item">
              <span class="label">System Status</span>
              <span class="value status-online" id="system-status">Online</span>
            </div>
          </div>
        </div>
      </header>

      <main class="main-content">
        <div class="controls">
          <button
            id="refresh-btn"
            class="btn btn-primary"
            aria-label="Refresh connections"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
            </svg>
            <span>Refresh</span>
          </button>
          <label class="auto-refresh-toggle">
            <input
              type="checkbox"
              id="auto-refresh"
              checked
              aria-label="Toggle auto-refresh"
            />
            <span>Auto-refresh</span>
          </label>
        </div>

        <div id="connections-container" class="connections-container">
          <div class="loading">Scanning for connections...</div>
        </div>
      </main>

      <footer class="footer">
        <p>SSH Bastion Dashboard v0.1.0</p>
      </footer>
    </div>

    <script src="/web-dashboard/src/templates/script.js"></script>
  </body>
</html>
